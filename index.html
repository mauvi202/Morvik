<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DJ Morvik</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a0033, #000);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* HERO */
.hero {
  padding: 100px 20px;
}

/* PROFILE */
.pfp {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #a855f7;
  box-shadow: 0 0 30px #a855f7;
  margin-bottom: 20px;
  transition: 0.3s;
}

.pfp:hover {
  transform: scale(1.1);
  box-shadow: 0 0 60px #c084fc;
}

h1 {
  font-size: 52px;
  margin: 10px 0;
  letter-spacing: 3px;
}

.subtitle {
  font-size: 18px;
  color: #bbb;
  margin-bottom: 30px;
}

/* BUTTON */
button {
  padding: 14px 35px;
  margin: 10px;
  background: linear-gradient(45deg, #a855f7, #7c3aed);
  border: none;
  color: white;
  cursor: pointer;
  font-weight: bold;
  border-radius: 30px;
  transition: 0.3s;
  font-size: 16px;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 25px #a855f7;
}

/* SECTION */
.section {
  padding: 80px 20px;
}

h2 {
  font-size: 30px;
  margin-bottom: 15px;
  color: #c084fc;
}

.text {
  max-width: 650px;
  margin: auto;
  color: #ccc;
  line-height: 1.7;
}

/* DIVIDER */
.divider {
  width: 70px;
  height: 3px;
  background: #a855f7;
  margin: 20px auto;
  box-shadow: 0 0 10px #a855f7;
}

/* SIDE SOUND BARS */
.bars {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 30px;
  height: 20px; /* FIX HEIGHT → verhindert Bewegung */
}

.bar {
  width: 20px;
  height: 6px;
  background: #a855f7;
  animation: moveSide 1s infinite;
}

.bar:nth-child(2) { animation-delay: 0.2s; }
.bar:nth-child(3) { animation-delay: 0.4s; }
.bar:nth-child(4) { animation-delay: 0.6s; }

@keyframes moveSide {
  0%,100% { width: 20px; }
  50% { width: 60px; }
}
</style>

</head>

<body>

<!-- HERO -->
<div class="hero">
  <img src="IMG_9006.jpeg" class="pfp">

  <h1>DJ MORVIK</h1>
  <div class="divider"></div>

  <p class="subtitle">
    Sound. Energy. Nightlife.  
    Ich bring die Crowd zum Eskalieren.
  </p>

  <a href="https://www.instagram.com/morvikmusic/" target="_blank">
    <button>Instagram</button>
  </a>

  <!-- SIDE SOUND BARS -->
  <div class="bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>

<!-- ABOUT -->
<div class="section">
  <h2>Über mich</h2>
  <div class="divider"></div>

  <p class="text">
    Ich bin DJ Morvik.  
    Musik ist Energie, Emotion und pure Atmosphäre.  
    Mein Ziel: jede Crowd fühlen lassen, was echter Vibe bedeutet.
  </p>
</div>

<!-- CONTACT -->
<div class="section">
  <h2>Bookings</h2>
  <div class="divider"></div>

  <p class="text">
    Für Events, Clubs oder Projekte –  
    schreib mir direkt auf Instagram.
  </p>
</div>

</body>
</html>
