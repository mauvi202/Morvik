<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DJ Morvik</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a0033, #000);
  color: white;
  text-align: center;
}

/* HERO */
.hero {
  padding: 70px 20px 30px; /* weniger Abstand nach unten */
}

/* PROFILE */
.pfp {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #a855f7;
  box-shadow: 0 0 30px #a855f7;
  margin-bottom: 20px;
}

/* TEXT */
h1 {
  font-size: 50px;
  margin: 10px 0;
}

.subtitle {
  color: #bbb;
  margin-bottom: 15px;
}

/* BUTTON */
button {
  padding: 12px 30px;
  background: linear-gradient(45deg, #a855f7, #7c3aed);
  border: none;
  color: white;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 10px;
}

/* VISUALIZER */
.visualizer {
  margin: 20px auto 10px; /* näher an nächste Section */
  width: 260px; /* breiter */
  height: 50px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
}

/* BARS */
.bar {
  width: 4px;
  background: #a855f7;
  animation: bounce 0.9s infinite ease-in-out;
}

/* RANDOM DELAYS + DURATIONS */
.bar:nth-child(1) { animation-delay: 0.1s; animation-duration: 0.9s; }
.bar:nth-child(2) { animation-delay: 0.3s; animation-duration: 1.1s; }
.bar:nth-child(3) { animation-delay: 0.5s; animation-duration: 0.8s; }
.bar:nth-child(4) { animation-delay: 0.2s; animation-duration: 1.2s; }
.bar:nth-child(5) { animation-delay: 0.6s; animation-duration: 0.7s; }
.bar:nth-child(6) { animation-delay: 0.4s; animation-duration: 1.0s; }
.bar:nth-child(7) { animation-delay: 0.7s; animation-duration: 0.9s; }
.bar:nth-child(8) { animation-delay: 0.2s; animation-duration: 1.3s; }
.bar:nth-child(9) { animation-delay: 0.5s; animation-duration: 0.8s; }
.bar:nth-child(10){ animation-delay: 0.1s; animation-duration: 1.1s; }
.bar:nth-child(11){ animation-delay: 0.6s; animation-duration: 0.7s; }
.bar:nth-child(12){ animation-delay: 0.3s; animation-duration: 1.2s; }
.bar:nth-child(13){ animation-delay: 0.4s; animation-duration: 0.9s; }
.bar:nth-child(14){ animation-delay: 0.2s; animation-duration: 1.0s; }
.bar:nth-child(15){ animation-delay: 0.7s; animation-duration: 0.8s; }

/* RANDOM HEIGHT ANIMATION */
@keyframes bounce {
  0%,100% { height: 8px; }
  50% { height: 45px; }
}

/* SECTION */
.section {
  padding: 40px 20px; /* weniger Abstand */
}

h2 {
  color: #c084fc;
}

.text {
  max-width: 600px;
  margin: auto;
  color: #ccc;
}
</style>

</head>

<body>

<div class="hero">
  <img src="IMG_9006.jpeg" class="pfp">

  <h1>DJ MORVIK</h1>
  <p class="subtitle">Sound. Energy. Nightlife.</p>

  <a href="https://www.instagram.com/morvikmusic/" target="_blank">
    <button>Instagram</button>
  </a>

  <!-- VISUALIZER -->
  <div class="visualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
</div>

<div class="section">
  <h2>Über mich</h2>
  <p class="text">
    Ich bin DJ Morvik. Musik ist Energie, Emotion und Atmosphäre.  
    Mein Ziel: jede Crowd fühlen lassen, was echter Vibe ist.
  </p>
</div>

<div class="section">
  <h2>Bookings</h2>
  <p class="text">
    Für Events & Clubs → schreib mir auf Instagram.
  </p>
</div>

</body>
</html>
