<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DJ Morvik</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a0033, #000);
  color: white;
  text-align: center;
}

/* HERO */
.hero {
  padding: 80px 20px;
}

/* PROFILE */
.pfp {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #a855f7;
  box-shadow: 0 0 30px #a855f7;
  margin-bottom: 20px;
}

/* TEXT */
h1 {
  font-size: 50px;
  margin: 10px 0;
}

.subtitle {
  color: #bbb;
  margin-bottom: 20px;
}

/* BUTTON */
button {
  padding: 12px 30px;
  background: linear-gradient(45deg, #a855f7, #7c3aed);
  border: none;
  color: white;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 10px;
}

/* VISUALIZER BOX */
.visualizer {
  margin: 25px auto;
  width: 140px;
  height: 50px; /* FIXED HEIGHT → KEIN WACKELN */
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px; /* enger Abstand */
}

/* BARS */
.bar {
  width: 6px;
  height: 10px;
  background: #a855f7;
  animation: bounce 1s infinite ease-in-out;
}

/* DELAYS für Variation */
.bar:nth-child(2) { animation-delay: 0.1s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.3s; }
.bar:nth-child(5) { animation-delay: 0.4s; }
.bar:nth-child(6) { animation-delay: 0.5s; }
.bar:nth-child(7) { animation-delay: 0.6s; }

/* ANIMATION */
@keyframes bounce {
  0%,100% { height: 10px; }
  50% { height: 45px; }
}

/* SECTION */
.section {
  padding: 60px 20px;
}

h2 {
  color: #c084fc;
}

.text {
  max-width: 600px;
  margin: auto;
  color: #ccc;
}
</style>

</head>

<body>

<div class="hero">
  <img src="IMG_9006.jpeg" class="pfp">

  <h1>DJ MORVIK</h1>
  <p class="subtitle">Sound. Vibes. Energy.</p>

  <a href="https://www.instagram.com/morvikmusic/" target="_blank">
    <button>Instagram</button>
  </a>

  <!-- VISUALIZER -->
  <div class="visualizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>

<div class="section">
  <h2>Über mich</h2>
  <p class="text">
    Ich bin DJ Morvik. Musik ist für mich mehr als nur Sound –  
    es ist Energie, Emotion und echte Atmosphäre.
  </p>
</div>

<div class="section">
  <h2>Bookings</h2>
  <p class="text">
    Für Events & Clubs → schreib mir auf Instagram.
  </p>
</div>

</body>
</html>
